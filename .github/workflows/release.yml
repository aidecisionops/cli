name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_name: dops-linux-x64
            binary_path: dist/dops
          - runner: ubuntu-24.04-arm
            artifact_name: dops-linux-arm64
            binary_path: dist/dops
          - runner: macos-15-intel
            artifact_name: dops-darwin-x64
            binary_path: dist/dops
          - runner: macos-15
            artifact_name: dops-darwin-arm64
            binary_path: dist/dops
          - runner: windows-latest
            artifact_name: dops-windows-x64.exe
            binary_path: dist/dops.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Stamp release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -c 'import os,tomllib; from pathlib import Path; v=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v, "tag/package version mismatch"'
          printf '__version__ = "%s"\n' "$VERSION" > dops/_build_version.py

      - name: Code quality checks
        run: python scripts/check_code_quality.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build release binary
        run: |
          pyinstaller --onefile --name dops --hidden-import=certifi --collect-data=certifi --hidden-import=_ssl dops_bootstrap.py

      - name: Smoke test packaged binary
        shell: bash
        run: |
          "${{ matrix.binary_path }}" --version
          "${{ matrix.binary_path }}" --help >/dev/null
          "${{ matrix.binary_path }}" config show
          "${{ matrix.binary_path }}" platform list

      - name: Rename artifact
        shell: bash
        run: |
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload validated binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Check complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in dops-linux-x64 dops-linux-arm64 dops-darwin-x64 dops-darwin-arm64 dops-windows-x64.exe; do
            test -s "release-assets/$asset"
          done
          (cd release-assets && sha256sum dops-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --notes "Public DecisionOps CLI distribution under aidecisionops. Skill resources download from aidecisionops/skill. All five binaries passed CI and packaging smoke checks before publication. Decision: DEC-2026-1073."
